<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Вслух</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="mini.css">
</head>
<body>

<!-- всё окошко тянется мышью; кнопки и полоса из перетаскивания исключены -->
<div class="card" id="card">

  <div class="art" id="art">
    <img id="art-img" alt="">
    <span class="art-ph">♫</span>
  </div>

  <div class="meta">
    <div class="line">
      <div class="title" id="title">—</div>
      <button class="ghost up" id="b-up" title="Вернуть большое окно" aria-label="Вернуть большое окно">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 1.8h3.7v3.7M12.2 1.8 7.9 6.1M5.5 12.2H1.8V8.5M1.8 12.2 6.1 7.9"/></svg>
      </button>
    </div>
    <div class="artist" id="artist"></div>

    <div class="ctrl">
      <button class="ghost heart" id="b-fav" title="В любимые" aria-label="В любимые">
        <svg viewBox="0 0 16 16"><path d="M8 13.7 2.9 8.9C1.3 7.4 1.4 4.9 3.1 3.6c1.4-1.1 3.4-.7 4.4.7l.5.7.5-.7c1-1.4 3-1.8 4.4-.7 1.7 1.3 1.8 3.8.2 5.3z"/></svg>
      </button>
      <button class="ghost" id="b-prev" title="Назад" aria-label="Назад">
        <svg viewBox="0 0 16 16"><path d="M3.6 3h1.7v10H3.6zM13 3.4v9.2L6.2 8z"/></svg>
      </button>
      <button class="play" id="b-play" title="Играть" aria-label="Играть">
        <svg id="ic-play" viewBox="0 0 16 16"><path d="M5 2.8v10.4L13.5 8z"/></svg>
        <svg id="ic-pause" viewBox="0 0 16 16" hidden><path d="M4.5 3h2.6v10H4.5zM8.9 3h2.6v10H8.9z"/></svg>
      </button>
      <button class="ghost" id="b-next" title="Вперёд" aria-label="Вперёд">
        <svg viewBox="0 0 16 16"><path d="M10.7 3h1.7v10h-1.7zM3 3.4v9.2L9.8 8z"/></svg>
      </button>
      <div class="time" id="time">0:00</div>
    </div>
  </div>

</div>

<!-- полоса внизу окна: и показывает место в треке, и перематывает -->
<div class="seek" id="seek"><div class="seek-fill" id="seek-fill"></div><div class="seek-knob" id="seek-knob"></div></div>

<script src="mini.js"></script>
</body>
</html>
