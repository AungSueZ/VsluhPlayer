# Сборка под Windows и Linux.
#
# AppImage с Windows собрать нельзя, поэтому линуксовую сборку делает
# машина GitHub. Запускается руками (вкладка Actions -> Run workflow)
# или сама, когда появляется тег версии.
#
# Обычный запуск просто складывает готовые файлы во вкладку Actions.
# А если пришёл тег версии - те же файлы отправляются в релиз, но ЧЕРНОВИКОМ:
# наружу он не виден, обновление никому не предлагается, пока человек сам
# не нажмёт "Publish release".

name: Сборка

on:
  # Кнопка "запустить" в Actions - вкладка Actions -> Сборка -> Run workflow.
  workflow_dispatch:
  push:
    tags:
      - '*'

# на запись - чтобы сборка по тегу могла завести черновик релиза
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # по одной машине за раз: при сборке по тегу обе заливают файлы в один
      # и тот же черновик релиза, и параллельно они дрались бы за право его завести
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Собрать
        # тег - значит релиз (черновиком), всё остальное - просто артефакты
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Забрать готовое
        uses: actions/upload-artifact@v4
        with:
          name: vsluh-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
