# Сборка под Windows и Linux.
#
# AppImage с Windows собрать нельзя, поэтому линуксовую сборку делает
# машина GitHub. Запускается руками (вкладка Actions -> Run workflow)
# или сама, когда появляется тег версии.
#
# Готовые файлы лежат во вкладке Actions как артефакты. В релиз ничего
# не выкладывается само - это делает человек.

name: Сборка

on:
  # Кнопка "запустить" в Actions появляется только у файлов из главной ветки,
  # поэтому пока ветка linux собирается сама при каждом пуше.
  workflow_dispatch:
  push:
    branches:
      - linux
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Собрать
        run: npx electron-builder --publish never

      - name: Забрать готовое
        uses: actions/upload-artifact@v4
        with:
          name: vsluh-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
